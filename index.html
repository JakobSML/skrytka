<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skrytka Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a roll-up storage door as the visual anchor; floor-plan cells show the chosen area; signage type for headings, mono for box IDs. */
:root {
  --bg: #E9EDEF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F6;
  --ink: #13222C;
  --muted: #52646F;
  --line: #CBD5DA;
  --door: #1F4E5F;
  --door-ink: #FFFFFF;
  --signal: #F2B705;
  --signal-ink: #13222C;
  --ok: #1E7F4F;
  --warn: #8A5F00;
  --danger: #B3261E;
  --focus: #1F4E5F;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E181F; --surface: #15232D; --surface-2: #1B2C38; --ink: #E7EEF1; --muted: #9AB0BB;
    --line: #2B4150; --door: #6FB3C8; --door-ink: #0E181F; --signal: #F2B705; --signal-ink: #13222C;
    --ok: #5CC592; --warn: #E3B341; --danger: #FF8A80; --focus: #6FB3C8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E181F; --surface: #15232D; --surface-2: #1B2C38; --ink: #E7EEF1; --muted: #9AB0BB;
  --line: #2B4150; --door: #6FB3C8; --door-ink: #0E181F; --signal: #F2B705; --signal-ink: #13222C;
  --ok: #5CC592; --warn: #E3B341; --danger: #FF8A80; --focus: #6FB3C8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* top strip and header */
.proto { background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 12px; text-align: center; padding: 6px 16px; }
header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 28px; text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: .01em; }
.brand i { width: 26px; height: 22px; display: block; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(180deg, var(--door) 0 4px, var(--bg) 4px 6px); border: 2px solid var(--door); }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; }
nav.main a { text-decoration: none; padding: 8px 12px; border-radius: 4px; font-weight: 500; font-size: 15px; }
nav.main a:hover { background: var(--surface-2); }
nav.main a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.lang { display: flex; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; cursor: pointer; min-height: 36px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); background: transparent; padding: 12px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 46px; }
.btn:hover { background: var(--surface-2); }
.btn-signal { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.btn-signal:hover { background: var(--signal); filter: brightness(.95); }
.btn-small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* hero */
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding-block: 56px 48px; }
.hero h1 { font-size: clamp(46px, 7.4vw, 92px); letter-spacing: -.005em; margin-block: 14px 20px; }
.hero p.lead { font-size: 19px; max-width: 34em; color: var(--muted); }
.hero .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.door { min-height: 340px; border-radius: 6px; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; color: var(--door-ink);
  background: repeating-linear-gradient(180deg, var(--door) 0 16px, color-mix(in srgb, var(--door) 78%, #000) 16px 19px); border: 2px solid color-mix(in srgb, var(--door) 70%, #000); }
.door::after { content: ""; position: absolute; left: 50%; bottom: 14px; width: 64px; height: 8px; margin-left: -32px; border-radius: 4px; background: color-mix(in srgb, var(--door) 55%, #000); }
.door .plate { align-self: flex-start; background: var(--signal); color: var(--signal-ink); padding: 8px 12px; border-radius: 3px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.door .price { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; background: color-mix(in srgb, var(--door) 90%, #000); align-self: flex-start; padding: 8px 14px 10px; border-radius: 3px; margin-bottom: 26px; }
.door .price small { font-family: var(--font-body); font-size: 14px; font-weight: 500; margin-left: 4px; }

/* sections */
section.block { padding-block: 48px; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
section.block > .wrap > h2 { font-size: clamp(32px, 4.4vw, 48px); margin-bottom: 8px; }
.sub { color: var(--muted); max-width: 40em; margin-bottom: 28px; }
.fit-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 32px; }
.fit-list div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.fit-list b { font-weight: 600; }
.fit-list span { font-family: var(--font-mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
.steps li::before { content: var(--step-label, "Step") " " counter(s); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 10px; }
.steps h3 { font-size: 26px; margin-bottom: 8px; }
.steps p { color: var(--muted); font-size: 15px; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.starter { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.starter h3 { font-size: 34px; }
.starter .cost { font-family: var(--font-mono); font-size: 15px; }
.starter p { color: var(--muted); font-size: 15px; flex: 1; }
details.faq { border-bottom: 1px solid var(--line); padding: 16px 0; }
details.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details.faq summary::after { content: "+"; font-family: var(--font-mono); }
details.faq[open] summary::after { content: "\2212"; }
details.faq p { color: var(--muted); margin-top: 10px; max-width: 46em; }
footer.site { background: repeating-linear-gradient(180deg, var(--door) 0 16px, color-mix(in srgb, var(--door) 78%, #000) 16px 19px); color: var(--door-ink); padding-block: 36px; margin-top: 40px; }
footer.site .wrap { display: flex; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
footer.site .brand i { border-color: var(--door-ink); background: repeating-linear-gradient(180deg, var(--door-ink) 0 4px, transparent 4px 6px); }
footer.site p { font-size: 14px; max-width: 34em; background: color-mix(in srgb, var(--door) 90%, #000); padding: 8px 12px; border-radius: 3px; }

/* waitlist */
.wl-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 32px; align-items: start; }
.wl-grid h2 { font-size: clamp(32px, 4.4vw, 48px); margin-bottom: 12px; }
.wl-grid .sub { margin-bottom: 0; }
.wl-form { display: flex; flex-direction: column; gap: 16px; }
.picks { display: flex; gap: 8px; flex-wrap: wrap; }
.pick { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.pick span { display: block; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-size: 14px; }
.pick input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pick input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.wl-ok { border: 2px solid var(--ok); border-radius: 6px; padding: 22px; background: var(--surface); }
.wl-ok h3 { font-size: 36px; margin-bottom: 8px; }

/* plan + checkout */
.page-head { padding-block: 36px 20px; }
.page-head h1 { font-size: clamp(38px, 5.5vw, 60px); margin-block: 8px; }
.progress { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.progress span { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.progress span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plan-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; padding-bottom: 24px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 22px; }
.card h2 { font-size: 30px; margin-bottom: 4px; }
.card .hint { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
.area-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.area-val { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; }
.area-val small { font-size: 28px; margin-left: 4px; }
input[type=range] { width: 100%; accent-color: var(--door); margin-block: 14px; height: 32px; }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-block: 8px 14px; }
.cells i { aspect-ratio: 1; border: 1.5px solid var(--line); border-radius: 2px; display: block; }
.cells i.on { background: var(--door); border-color: var(--door); }
.fits { display: flex; gap: 6px 20px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.fits b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; width: 100%; height: 100%; }
.opt label { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.opt input:checked + label { border-color: var(--door); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--door); }
.opt input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt .t { font-weight: 600; }
.opt .d { font-size: 14px; color: var(--muted); }
.opt .p { font-family: var(--font-mono); font-size: 14px; margin-top: auto; padding-top: 6px; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 12px; }
.summary h2 { font-size: 28px; }
.line { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.line span:last-child { font-family: var(--font-mono); white-space: nowrap; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 6px; }
.total b { font-family: var(--font-display); font-size: 52px; line-height: 1; }
.total b small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.fine { font-size: 13px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lbl { font-size: 14px; font-weight: 600; }
.field input[type=text], .field input[type=email], .field input[type=tel], .field select, .field textarea { background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px 12px; min-height: 44px; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--door); }
.payslot { border: 2px dashed var(--line); border-radius: 6px; padding: 20px; background: var(--surface-2); }
.payslot b { display: block; margin-bottom: 4px; }
.payslot p { color: var(--muted); font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--door); flex: none; }
.done { text-align: left; max-width: 640px; }
.done h2 { font-size: 48px; margin-bottom: 12px; }

/* account */
.acct-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.stat .k { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.meter { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--door); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.tools input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px 12px; min-height: 44px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding-bottom: 96px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box.sel { border-color: var(--door); box-shadow: 0 0 0 2px var(--door); }
.box-top { display: flex; align-items: center; gap: 10px; }
.box-top input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--door); }
.box-id { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); flex: 1; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.stored { color: var(--ok); }
.pill.pickup { color: var(--warn); }
.pill.out { color: var(--muted); }
.box-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; border: 0; border-bottom: 1.5px solid transparent; background: transparent; padding: 2px 0; width: 100%; }
.box-name:hover, .box-name:focus { border-bottom-color: var(--line); }
.notes { width: 100%; border: 1.5px dashed var(--line); border-radius: 4px; background: var(--surface-2); padding: 10px 12px; resize: none; min-height: 84px; line-height: 1.45; font-size: 15px; }
.notes:focus { border-style: solid; border-color: var(--door); background: var(--surface); }
.box-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
.saved { opacity: 0; transition: opacity .2s; color: var(--ok); }
.saved.on { opacity: 1; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; color: var(--muted); }
.empty { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 6px; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--ink); color: var(--bg); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.actionbar .inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.actionbar .btn { border-color: var(--bg); color: var(--bg); }
.actionbar .btn:hover { background: transparent; filter: brightness(1.2); }
.actionbar .btn-signal { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 2px solid var(--ink); padding: 10px 16px; border-radius: 4px; z-index: 40; max-width: calc(100vw - 32px); font-size: 15px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 28px; padding-block: 32px; }
  .door { min-height: 240px; }
  .plan-grid { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .wl-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="proto" data-i18n="proto"></div>

<header class="site">
  <div class="wrap">
    <a class="brand" href="#home"><i></i>Skrytka</a>
    <nav class="main" data-i18n-label="navLabel">
      <a href="#home" data-nav="home" data-i18n="navHome"></a>
      <a href="#plan" data-nav="plan" data-i18n="navPlan"></a>
      <a href="#account" data-nav="account" data-i18n="navAccount"></a>
      <a href="#waitlist" data-i18n="navWait"></a>
    </nav>
    <div class="lang" role="group" data-i18n-label="langLabel">
      <button type="button" data-lang="pl" aria-pressed="false">PL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
<!-- HOME -->
<div id="view-home">
  <div class="wrap hero">
    <div>
      <div class="eyebrow" data-i18n="heroEyebrow"></div>
      <h1 data-i18n="heroH1"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="actions">
        <a class="btn btn-signal" href="#plan" data-i18n="ctaPlan"></a>
        <a class="btn" href="#waitlist" data-i18n="ctaWait"></a>
      </div>
    </div>
    <div class="door" aria-hidden="true">
      <div class="plate" data-i18n="plate"></div>
      <div class="price num"><span id="hero-price">0</span><small data-i18n="perMonth"></small></div>
    </div>
  </div>

  <section class="block" id="fits">
    <div class="wrap">
      <h2 data-i18n="fitsH"></h2>
      <p class="sub" data-i18n="fitsSub"></p>
      <div class="fit-list" id="fit-list"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <h2 data-i18n="howH"></h2>
      <p class="sub" data-i18n="howSub"></p>
      <ol class="steps">
        <li><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></li>
        <li><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></li>
        <li><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></li>
      </ol>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <h2 data-i18n="startH"></h2>
      <p class="sub" data-i18n="startSub"></p>
      <div class="starters" id="starters"></div>
    </div>
  </section>

  <section class="block" id="waitlist">

        '<div class="box-foot"><span class="size"></span><span class="saved"></span></div><div class="tags"></div>';
      var cb = c.querySelector('input[type=checkbox]'); cb.setAttribute('aria-label', t('selAria')); cb.checked = !!selected[b.id]; cb.disabled = b.status !== 'stored';
      cb.addEventListener('change', function () { if (cb.checked) selected[b.id] = true; else delete selected[b.id]; c.classList.toggle('sel', cb.checked); renderBar(); });
      c.querySelector('.box-id').textContent = b.id;
      var p = c.querySelector('.pill'); p.textContent = t(STATUS[b.status]); p.className = 'pill ' + b.status;
      var nm = c.querySelector('.box-name'); nm.value = bName(b); nm.setAttribute('aria-label', t('nameAria'));
      var nt = c.querySelector('.notes'); nt.value = bNotes(b); nt.placeholder = t('notesPh'); nt.setAttribute('aria-label', t('notesAria'));
      c.querySelector('.size').textContent = dec(b.size, 2) + ' m²';
      var saved = c.querySelector('.saved'); saved.textContent = t('saved');
      var st;
      function flash() { saved.classList.add('on'); clearTimeout(st); st = setTimeout(function () { saved.classList.remove('on'); }, 1200); }
      function grow() { nt.style.height = 'auto'; nt.style.height = Math.max(84, nt.scrollHeight + 2) + 'px'; }
      nm.addEventListener('input', function () { b.name = nm.value; persist(); flash(); });
      nt.addEventListener('input', function () { b.notes = nt.value; persist(); flash(); grow(); });
      var tg = c.querySelector('.tags'); b.tags.forEach(function (k) { var s = document.createElement('span'); s.className = 'tag'; s.textContent = t('tg_' + k); tg.appendChild(s); });
      host.appendChild(c); grow();
    });
  }
  function renderBar() {
    var n = Object.keys(selected).length;
    $('#actionbar').hidden = n === 0;
    $('#sel-count').textContent = t('selCount', { n: n });
  }
  $('#q').addEventListener('input', renderBoxes);
  $('#filters').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    renderBoxes();
  });
  $('#add-box').addEventListener('click', function () {
    var max = boxes.reduce(function (m, b) { return Math.max(m, parseInt(b.id.slice(3), 10) || 0); }, 140);
    boxes.unshift({ id: 'BX-' + String(max + 1).padStart(4, '0'), size: 0.12, status: 'stored', tags: [], nameKey: 'newBox', notes: '' });
    persist(); filter = 'all'; $('#q').value = '';
    document.querySelectorAll('#filters .chip').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.f === 'all' ? 'true' : 'false'); });
    renderAccount();
    var first = document.querySelector('#boxes .notes'); if (first) first.focus();
    toast(t('toastAdd'));
  });
  $('#sel-clear').addEventListener('click', function () { selected = {}; renderBar(); renderBoxes(); });
  $('#sel-go').addEventListener('click', function () {
    var ids = Object.keys(selected);
    boxes.forEach(function (b) { if (selected[b.id]) b.status = 'pickup'; });
    tripsUsed++; persist(); selected = {}; renderBar(); renderAccount();
    toast(ids.length === 1 ? t('toastRet1') : t('toastRetN', { n: ids.length }));
  });

  /* ---------- boot ---------- */
  applyStatic(); renderHome(); setStep(1, true); renderBar();
  var h0 = location.hash.replace('#', '');
  if (h0 === 'fits' || h0 === 'waitlist') { show('home'); route(); } else show(VIEWS.indexOf(h0) >= 0 ? h0 : 'home');
})();
</script>

</body></html>
